name: Bug report
description: Something does not work the way it is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include anything that would identify you or the traffic
        you were routing — hostnames, exit addresses, request bodies or logs
        with URLs in them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command you ran, with any sensitive parts replaced.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: go-toralizer version
      description: Output of `go-toralizer version`.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 / macOS 15 / Windows 11
    validations:
      required: true

  - type: input
    id: tor
    attributes:
      label: Tor version and how it is running
      placeholder: tor 0.4.8.12 from the distribution package, SOCKS on 9050
