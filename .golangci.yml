version: "2"
run:
  go: "1.27"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - misspell
    - gocritic
    - bodyclose
    - noctx
    - errorlint
    - unconvert
    - prealloc
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
